name: forge-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.7.1"

      - name: Show versions
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Run tests (Ethernaut + Ethernaut 2025)
        run: forge test -vv -j 1 --match-path "test/ethernaut*/**"
